<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBM - Small Business Manager</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="manifest.json">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getStorage } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';
        
        // Firebase config will be populated from js/firebase/config.js
        window.firebaseModules = { initializeApp, getFirestore, getAuth, getStorage };
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- App Icon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
</head>
<body class="bg-gray-50">
    <!-- SPA Container -->
    <div id="app">
        <!-- Navigation -->
        <nav class="bg-white shadow-lg fixed top-0 w-full z-50">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center space-x-3">
                        <div class="bg-indigo-600 p-2 rounded-lg">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                            </svg>
                        </div>
                        <h1 class="text-xl font-bold text-gray-800">SBM</h1>
                    </div>
                    
                    <!-- Mobile menu button -->
                    <button id="mobile-menu-button" class="md:hidden">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    
                    <!-- Desktop Navigation -->
                    <div class="hidden md:flex space-x-8">
                        <a href="#dashboard" class="nav-link active">Dashboard</a>
                        <a href="#products" class="nav-link">Products</a>
                        <a href="#sales" class="nav-link">Sales</a>
                        <a href="#finance" class="nav-link">Finance</a>
                        <a href="#reports" class="nav-link">Reports</a>
                    </div>
                </div>
            </div>
            
            <!-- Mobile Navigation -->
            <div id="mobile-menu" class="md:hidden hidden bg-white border-t">
                <div class="px-2 pt-2 pb-3 space-y-1">
                    <a href="#dashboard" class="mobile-nav-link block px-3 py-2">Dashboard</a>
                    <a href="#products" class="mobile-nav-link block px-3 py-2">Products</a>
                    <a href="#sales" class="mobile-nav-link block px-3 py-2">Sales</a>
                    <a href="#finance" class="mobile-nav-link block px-3 py-2">Finance</a>
                    <a href="#reports" class="mobile-nav-link block px-3 py-2">Reports</a>
                </div>
            </div>
        </nav>
        
        <!-- Main Content -->
        <main class="pt-16 min-h-screen">
            <div id="content" class="max-w-7xl mx-auto px-4 py-8">
                <!-- Content will be dynamically loaded here -->
                <div id="loading" class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
                    <p class="mt-4 text-gray-600">Loading SBM...</p>
                </div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="bg-white border-t mt-12">
            <div class="max-w-7xl mx-auto px-4 py-6">
                <div class="flex flex-col md:flex-row justify-between items-center">
                    <p class="text-gray-600 text-sm">© 2024 Small Business Manager. All rights reserved.</p>
                    <div class="flex space-x-4 mt-4 md:mt-0">
                        <button id="export-data" class="text-sm text-indigo-600 hover:text-indigo-800">Export Data</button>
                        <button id="offline-status" class="text-sm px-3 py-1 rounded-full bg-green-100 text-green-800">Online</button>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    
    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
    
    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('SW registered:', registration);
                    })
                    .catch(error => {
                        console.log('SW registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
